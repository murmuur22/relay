name: Linux release preflight
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: linux-release-preflight-${{ github.ref }}
  cancel-in-progress: false
jobs:
  preflight:
    if: github.repository == 'murmuur22/relay'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '26.8.1'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Build both bundles and provision disposable browser prerequisites
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/relay-browsers
        run: |
          npm ci --ignore-scripts
          npm --prefix updater/ui ci --ignore-scripts
          npm run build
          npm run build:updater
          python3 -m pip install Pillow==11.3.0
          node node_modules/playwright/cli.js install --with-deps chromium
          # Preserve only runtime Chromium/FFmpeg bytes before adding WebKit's test tier.
          mkdir -m 700 "$RUNNER_TEMP/relay-package-browsers"
          cp -a "$RUNNER_TEMP/relay-browsers/." "$RUNNER_TEMP/relay-package-browsers/"
          node node_modules/playwright/cli.js install --with-deps webkit
          # This is a fresh hosted VM, not an operator/production host.
          # Chromium remains sandbox-enabled; allow its user namespaces here.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Verify unchanged signed old broker modules for real HMAC browser fixtures
        run: |
          for baseline in v0.6.3 v0.6.4; do
            directory="$RUNNER_TEMP/public-$baseline"
            mkdir -m 700 "$directory"
            for asset in relay-release.json relay-release.attestation.json relay-updater-linux-x64.tar.gz; do
              env -i PATH="$PATH" curl -q --fail --location --proto '=https' --proto-redir '=https' --max-time 180 --max-filesize 1048576 --output "$directory/$asset" "https://github.com/murmuur22/relay/releases/download/$baseline/$asset"
            done
            if [ "$baseline" = v0.6.3 ]; then source=220553aa557d0d6b4a442a11f2f1ee7ed88625ab; else source=0bf423eae6709b28fd5ace2a4b97e74924626fc8; fi
            anonymous_home="$(mktemp -d "$RUNNER_TEMP/relay-old-verifier.XXXXXX")"
            env -i PATH="$PATH" LANG=C.UTF-8 HOME="$anonymous_home" GH_CONFIG_DIR=/nonexistent GH_PROMPT_DISABLED=1 gh attestation verify "$directory/relay-release.json" --bundle "$directory/relay-release.attestation.json" --repo murmuur22/relay --signer-workflow murmuur22/relay/.github/workflows/release.yml --source-ref "refs/tags/$baseline" --source-digest "$source" --signer-digest "$source" --deny-self-hosted-runners
            rm -rf -- "$anonymous_home"
            python3 -m updater.release.verify_broker_baseline --source "$GITHUB_WORKSPACE" --manifest "$directory/relay-release.json" --archive "$directory/relay-updater-linux-x64.tar.gz"
          done
          printf 'RELAY_PRESENTATION_OLD_UPDATER_ARCHIVE=%s/public-v0.6.4/relay-updater-linux-x64.tar.gz\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
          printf 'RELAY_PRESENTATION_EVIDENCE_DIR=%s\nTMPDIR=%s\n' "$RUNNER_TEMP" "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Provision checksummed isolated Caddy test binary (no service installation)
        run: |
          mkdir -m 700 "$RUNNER_TEMP/relay-caddy"
          cd "$RUNNER_TEMP/relay-caddy"
          curl --fail --location --proto '=https' --proto-redir '=https' --max-time 180 https://github.com/caddyserver/caddy/releases/download/v2.11.4/caddy_2.11.4_linux_amd64.tar.gz -o caddy.tar.gz
          printf '%s  caddy.tar.gz\n' '8220d1f013b6f27510247b2360c9e0ca9f018feebd82515f07635318b34ff9777ccc8fd0b6e6f2486ce3a33fe389fbb7db12d05baa474f4587509fb4f5ebf1c9' | sha512sum --check -
          tar -xzf caddy.tar.gz caddy
          printf 'RELAY_TEST_CADDY=%s/relay-caddy/caddy\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Isolated separate-VM topology (three local Linux network namespaces)
        env:
          RELAY_TEST_NODE_IMAGE: node@sha256:367679cf9792759492a486e4aa4b421764d71a9546a6dae8aab81a99eb797b3e
        run: |
          docker context inspect --format '{{.Endpoints.docker.Host}}'
          docker pull "$RELAY_TEST_NODE_IMAGE"
          RELAY_TEST_CADDY_LINUX="$RELAY_TEST_CADDY" node tools/qualify-remote-containers.mjs
      - name: Python security and real standalone runtime regressions
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/relay-browsers
        run: |
          export RELAY_ICON_PYTHON="$(command -v python3)"
          python3 -m unittest discover -s updater/tests -v
          npm --prefix updater/ui run test:unit
          node --test --test-concurrency=1 --test-timeout=130000 tests/backend/updater*.test.mjs
          npm --prefix updater/ui test
          node --test --test-concurrency=1 --test-timeout=90000 updater/ui/tests/http-smoke.mjs updater/ui/tests/fixture-smoke.mjs
          node deploy/verify-standalone.mjs
          node --test --test-concurrency=1 --test-force-exit --test-reporter=tap --test-timeout=130000 tests/backend/private-lan*.test.mjs tests/frontend/updater*.test.mjs
          node --test --test-timeout=90000 tests/backend/web-request-body.test.mjs tests/backend/web-redirects.test.mjs tests/backend/stream-navigation.test.mjs tests/frontend/stream-navigation.test.mjs tests/backend/compressed-body-regression.test.mjs tests/backend/vite-boundaries.test.mjs
          node --test --test-concurrency=1 --test-timeout=130000 tests/backend/desktop-gateway*.test.mjs tests/backend/gateway-*.test.mjs tests/backend/native-preview-validation.test.mjs tests/backend/system-apps.test.mjs tests/frontend/desktop-gateway.test.mjs tests/frontend/gateway-*.test.mjs tests/frontend/native-preview-retirement.test.mjs tests/frontend/control-panel.test.mjs tests/frontend/personal-editor.test.mjs tests/frontend/personal-launch-race.test.mjs tests/frontend/personal-parallel-aba.test.mjs
          node --test --test-concurrency=1 --test-timeout=90000 tests/backend/maintenance-startup.test.mjs tests/backend/maintenance-managed-startup.test.mjs tests/backend/startup-cleanup.test.mjs
          node --test --test-concurrency=1 --test-timeout=90000 tests/backend/cancel-await.test.mjs tests/backend/cancel-close-retry.test.mjs tests/backend/cancel-published-retirement.test.mjs tests/backend/reviewer-cancel-adverse.test.mjs tests/backend/reviewer-revocation-consumers.test.mjs tests/backend/reviewer-shutdown-invariant.test.mjs tests/backend/revocation-cleanup.test.mjs tests/backend/shutdown-admission.test.mjs tests/backend/personal-launch-admission.test.mjs tests/backend/personal-launch-cleanup.test.mjs tests/backend/personal-open-mode.test.mjs
          RELAY_CANCEL_PHASE=newContext node --test --test-concurrency=1 --test-timeout=90000 tests/backend/cancel-await.test.mjs
          RELAY_CANCEL_PHASE=newCDPSession node --test --test-concurrency=1 --test-timeout=90000 tests/backend/cancel-await.test.mjs
      - name: Actual systemd mount-boundary install and rollback fixture
        run: |
          sudo install -m 0755 "$(command -v node)" /usr/bin/node
          sudo useradd --system --user-group --no-create-home --home-dir /nonexistent --shell /usr/sbin/nologin relay
          sudo mkdir /opt/relay-gateway-qualification
          sudo cp -a server dist node_modules tests version.js package.json updater tools /opt/relay-gateway-qualification/
          sudo chmod 0755 /opt/relay-gateway-qualification
          sudo systemd-run --quiet --wait --pipe --collect --property=User=relay --property=Group=relay --property=WorkingDirectory=/opt/relay-gateway-qualification --property=NoNewPrivileges=true --property=ProtectHome=true --property=ProtectSystem=strict --property=PrivateTmp=true --property=CapabilityBoundingSet= --property=MemoryMax=2G --property=CPUQuota=100% --property=TasksMax=512 --property=LimitNOFILE=8192 /usr/bin/node --test --test-concurrency=1 --test-timeout=130000 /opt/relay-gateway-qualification/tests/backend/gateway-deployment.test.mjs /opt/relay-gateway-qualification/tests/backend/gateway-management.test.mjs /opt/relay-gateway-qualification/tests/backend/gateway-management-races.test.mjs /opt/relay-gateway-qualification/tests/backend/gateway-management-expiry.test.mjs /opt/relay-gateway-qualification/tests/backend/gateway-management-retirement.test.mjs /opt/relay-gateway-qualification/tests/backend/native-preview-validation.test.mjs /opt/relay-gateway-qualification/tests/backend/gateway-proxy-boundary.test.mjs /opt/relay-gateway-qualification/tests/backend/gateway-proxy-config.test.mjs /opt/relay-gateway-qualification/tests/backend/gateway-caddy-snippet.test.mjs /opt/relay-gateway-qualification/tests/backend/gateway-remote.test.mjs /opt/relay-gateway-qualification/tests/backend/gateway-remote-expiry.test.mjs
          sudo env -i PATH=/usr/bin:/bin CI=true GITHUB_ACTIONS=true PYTHONDONTWRITEBYTECODE=1 /usr/bin/python3 -m updater.tests.test_mount_sandbox --disposable-github-systemd
          FAMILIES="$(python3 -c 'from pathlib import Path; print(next(x.split("=",1)[1] for x in Path("updater/web/relay-updater-web.service").read_text().splitlines() if x.startswith("RestrictAddressFamilies=")))')"
          sudo systemd-run --quiet --wait --pipe --collect --property=User=relay --property=NoNewPrivileges=true --property=CapabilityBoundingSet= --property="RestrictAddressFamilies=$FAMILIES" /usr/bin/node -e 'const os=require("os"),fs=require("fs"),assert=require("assert");assert(Object.values(os.networkInterfaces()).flat().some(n=>n.family==="IPv4"&&!n.internal));assert.match(fs.readFileSync("/proc/self/status","utf8"),/^CapEff:\s+0+$/m);console.log("PASS interface enumeration with empty capabilities")'
      - name: Build both allowlisted Linux payloads without publishing
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/relay-browsers
        run: |
          VERSION="v$(node -p 'JSON.parse(require("fs").readFileSync("package.json","utf8")).version')"
          python3 -m updater.release.validate_tag "$VERSION"
          npm prune --omit=dev --ignore-scripts
          python3 -m updater.release.build --source "$GITHUB_WORKSPACE" --browsers "$RUNNER_TEMP/relay-package-browsers" --output "$RUNNER_TEMP/relay-preflight-artifacts" --version "$VERSION"
          # No attestation, release, tag or deployment is created by this job.
